name: Build Windows DLL (Static libtorrent)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build'
        required: true
        default: 'v2.17'

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout vlc-bittorrent
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || 'v2.17' }}

      - name: Setup MSYS2 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          release: false
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-diffutils
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-vlc
            mingw-w64-ucrt-x86_64-boost
            git
            make

      # ======== 静态编译 libtorrent ========
      - name: Build static libtorrent
        run: |
          git clone --depth 1 -b v2.0.11 https://github.com/arvidn/libtorrent.git
          cd libtorrent
          
          mkdir build-static
          cd build-static
          
          cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -Dstatic_runtime=ON \
            -DCMAKE_INSTALL_PREFIX=/ucrt64-static \
            -Dboost-python-module=OFF \
            -Dpython-bindings=OFF \
            -Dpython-egg=OFF \
            -Dexamples=OFF \
            -Dtests=OFF \
            -Dtools=OFF \
            ..
          
          cmake --build . --parallel
          cmake --install .

      # ======== 编译 vlc-bittorrent 插件 ========
      - name: Build vlc-bittorrent plugin
        run: |
          cd $GITHUB_WORKSPACE
          
          # 让 pkg-config 找到静态版 libtorrent
          export PKG_CONFIG_PATH="/ucrt64-static/lib/pkgconfig:$PKG_CONFIG_PATH"
          
          # patch libtorrent 的 pkg-config 路径
          sed -i 's|-I/ucrt64-static|-I${prefix}|g' /ucrt64-static/lib/pkgconfig/libtorrent-rasterbar.pc
          
          mkdir -p build
          cd build
          
          cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_TESTS=OFF \
            ..
          
          cmake --build . --parallel

      # ======== 收集产物 ========
      - name: Collect plugin
        run: |
          mkdir -p artifact
          
          # 找到编译产物
          PLUGIN_DLL=$(find build -name "*bittorrent_plugin.dll" | head -1)
          
          if [ -z "$PLUGIN_DLL" ]; then
            echo "ERROR: 插件编译失败"
            find build -type f -name "*.dll"
            exit 1
          fi
          
          echo "插件位置: $PLUGIN_DLL"
          cp "$PLUGIN_DLL" artifact/
          
          # 检查依赖（应该只有 libvlccore.dll 和系统 DLL）
          echo "=== 插件依赖列表 ==="
          ldd "$PLUGIN_DLL"
          
          echo "=== 产物文件 ==="
          ls -la artifact/

      - name: Verify dependencies
        run: |
          PLUGIN_DLL=$(ls artifact/*bittorrent_plugin.dll | head -1)
          
          # 检查是否还有 MSYS2 运行时依赖
          BAD_DEPS=$(ldd "$PLUGIN_DLL" | grep -E "libtorrent|libstdc|libgcc|libwinpthread" || true)
          
          if [ -n "$BAD_DEPS" ]; then
            echo "WARNING: 仍有动态依赖，可能需要额外 DLL："
            echo "$BAD_DEPS"
          else
            echo "OK: 无 MSYS2 运行时依赖，插件自包含"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: vlc-bittorrent-static
          path: artifact/*
          if-no-files-found: error
          retention-days: 90
