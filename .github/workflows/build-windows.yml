name: Build Windows DLL

on:
  workflow_dispatch:   # 手动触发
  push:
    tags:
      - 'v*'           # push tag 时触发

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: 'v2.17'   # 锁定稳定版 tag

      - name: Set up MSYS2 and install dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          release: false
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-diffutils
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-libtorrent-rasterbar
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-vlc

      - name: Patch libtorrent pkg-config
        run: |
          sed -i 's|-I/ucrt64|-I${prefix}|g' /ucrt64/lib/pkgconfig/libtorrent-rasterbar.pc

      - name: Build
        run: |
          cmake -B build -DENABLE_TESTS=OFF
          cmake --build build -v

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: libbittorrent_plugin-windows
          path: |
            build/libbittorrent_plugin.dll
          retention-days: 90
