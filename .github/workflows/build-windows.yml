name: Build Windows DLL

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: 'v2.17'   # 用你之前查到的 commit SHA

      - name: Set up MSYS2 and install dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          release: false
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-diffutils
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-libtorrent-rasterbar
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-vlc

      - name: Patch libtorrent pkg-config
        run: |
          sed -i 's|-I/ucrt64|-I${prefix}|g' /ucrt64/lib/pkgconfig/libtorrent-rasterbar.pc

      - name: Build
        run: |
          cmake -B build -DENABLE_TESTS=OFF
          cmake --build build -v

      # 新增：列出实际产物，方便排查
      - name: List build output
        run: |
          find build -name "*.dll" -o -name "*.exe"
          ls -la build/

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v5
        with:
          name: libbittorrent_plugin-windows
          path: |
            build/**/*.dll
          if-no-files-found: error
          retention-days: 90