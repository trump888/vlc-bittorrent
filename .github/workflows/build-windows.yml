name: Build Windows DLL

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (tag, branch, or SHA)'
        required: true
        default: 'v2.17'

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || 'v2.17' }}

      - name: Set up MSYS2 and install dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          release: false
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-diffutils
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-libtorrent-rasterbar
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-vlc

      - name: Patch libtorrent pkg-config
        run: |
          sed -i 's|-I/ucrt64|-I${prefix}|g' /ucrt64/lib/pkgconfig/libtorrent-rasterbar.pc

      - name: Build
        run: |
          cmake -B build -DENABLE_TESTS=OFF
          cmake --build build -v

      - name: Collect plugin and dependencies
        run: |
          mkdir -p artifact
          
          # 按 VLC 插件命名惯例搜索：libaccess_bittorrent_plugin.dll
          PLUGIN_DLL=$(find build -name "*bittorrent_plugin.dll" 2>/dev/null | head -1)
          
          if [ -z "$PLUGIN_DLL" ]; then
            echo "ERROR: 找不到插件 DLL"
            find build -type f -name "*.dll" 2>/dev/null
            exit 1
          fi
          
          echo "找到插件: $PLUGIN_DLL"
          cp "$PLUGIN_DLL" artifact/
          
          # 递归收集 MSYS2 依赖
          collect_deps() {
            local dll=$1
            for dep in $(ldd "$dll" | grep ucrt64 | awk '{print $3}'); do
              if [ ! -f "artifact/$(basename $dep)" ]; then
                cp "$dep" artifact/
                collect_deps "$dep"
              fi
            done
          }
          
          collect_deps "$PLUGIN_DLL"
          
          echo "=== Collected files ==="
          ls -la artifact/

      - name: Verify all DLLs present
        run: |
          # 确认核心文件都在（文件名和 Collect 步骤保持一致）
          test -f artifact/libaccess_bittorrent_plugin.dll || (echo "FAIL: plugin DLL missing" && exit 1)
          test -f artifact/libtorrent-rasterbar.dll || (echo "FAIL: libtorrent DLL missing" && exit 1)
          echo "OK: all core DLLs present"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: vlc-bittorrent-windows
          path: artifact/*
          if-no-files-found: error
          retention-days: 90

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifact/*
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
